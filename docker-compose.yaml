# nginx proxy address - http://172.17.0.1:

name: memcached
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: 'bitnami/memcached:latest'
    container_name: memcached-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: memcached-app
      MEMCACHED_CACHE_SIZE: 1024
      MEMCACHED_MAX_CONNECTIONS: 2000
      MEMCACHED_USERNAME: ${DB_ADMIN_NAME:-root}
      MEMCACHED_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    extra_hosts:
      - 'localhost:172.17.0.1'
      - 'memcached:host-gateway'
      - 'host.docker.internal:host-gateway'
    networks:
      - memcached

networks:
  memcached:
    name: memcached
    external: false
